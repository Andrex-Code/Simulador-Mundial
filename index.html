<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador Mundial 2026</title>
    <style>
      .match-row > .team-label:last-child {
        justify-content: flex-start !important;
        text-align: left !important;
      }

      .facebook-share-panel {
        display: grid;
        gap: 14px;
        margin: 0 0 22px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.92);
      }

      .facebook-share-panel h3 {
        margin: 0;
        font-size: 20px;
      }

      .facebook-share-panel p {
        color: #bdc7d6;
        font-size: 14px;
      }

      .facebook-share-preview {
        width: 100%;
        max-height: 520px;
        object-fit: contain;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #070b12;
      }

      .facebook-share-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .facebook-share-actions button,
      .facebook-share-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        color: #e8eef8;
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .facebook-share-actions .facebook-primary {
        background: #1877f2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const STORAGE_KEY = "worldcup-2026-simulator";
        let latestImageUrl = "";
        let latestImageBlob = null;

        function cleanText(value) {
          return String(value || "")
            .replace(/\s+/g, " ")
            .replace(/\bRanking FIFA\b.*$/i, "")
            .trim();
        }

        function cropText(ctx, text, maxWidth) {
          const value = cleanText(text);
          if (ctx.measureText(value).width <= maxWidth) return value;
          let output = value;
          while (output.length > 3 && ctx.measureText(`${output}...`).width > maxWidth) {
            output = output.slice(0, -1);
          }
          return `${output}...`;
        }

        function roundRect(ctx, x, y, width, height, radius) {
          const r = Math.min(radius, width / 2, height / 2);
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + width, y, x + width, y + height, r);
          ctx.arcTo(x + width, y + height, x, y + height, r);
          ctx.arcTo(x, y + height, x, y, r);
          ctx.arcTo(x, y, x + width, y, r);
          ctx.closePath();
        }

        function encodeResultsForHash() {
          const raw = localStorage.getItem(STORAGE_KEY) || "{}";
          const bytes = new TextEncoder().encode(raw);
          let binary = "";
          bytes.forEach((byte) => {
            binary += String.fromCharCode(byte);
          });
          return btoa(binary);
        }

        function sharedPredictionUrl() {
          return `${window.location.origin}${window.location.pathname}#prediccion=${encodeResultsForHash()}`;
        }

        function getChampionName() {
          const champion = document.querySelector(".champion-mark strong")?.textContent;
          return cleanText(champion || "Campeón pendiente");
        }

        function getPredictionName() {
          const input = document.querySelector(".name-field input");
          return cleanText(input?.value || "Mi predicción");
        }

        function readMatchCard(card) {
          const title = cleanText(card.querySelector(".ko-title")?.textContent || "Partido");
          const teams = Array.from(card.querySelectorAll(".ko-team")).map((row) => {
            const team = cleanText(row.querySelector("span")?.textContent || "Por definir");
            const score = row.querySelector("input")?.value || "-";
            return { team, score };
          });
          const status = cleanText(card.querySelector("small")?.textContent || "Pendiente");
          return { title, teams, status };
        }

        function readRound(round) {
          return {
            label: cleanText(round.querySelector("h3")?.textContent || "Ronda"),
            matches: Array.from(round.querySelectorAll(".ko-card")).map(readMatchCard),
          };
        }

        function readBracketData() {
          const leftRounds = Array.from(document.querySelectorAll(".bracket-side.left .bracket-round")).map(readRound);
          const rightRounds = Array.from(document.querySelectorAll(".bracket-side.right .bracket-round")).map(readRound);
          const finalCards = Array.from(document.querySelectorAll(".final-lane .ko-card")).map(readMatchCard);
          return {
            predictionName: getPredictionName(),
            champion: getChampionName(),
            leftRounds,
            rightRounds,
            finalCards,
            url: sharedPredictionUrl(),
          };
        }

        function drawCard(ctx, card, x, y, width, height, accent) {
          roundRect(ctx, x, y, width, height, 14);
          ctx.fillStyle = "rgba(15, 23, 42, 0.94)";
          ctx.fill();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = accent;
          roundRect(ctx, x, y, 6, height, 8);
          ctx.fill();

          ctx.fillStyle = "#94a3b8";
          ctx.font = "700 15px Inter, Arial, sans-serif";
          ctx.fillText(cropText(ctx, card.title, width - 24), x + 16, y + 23);

          ctx.font = "800 18px Inter, Arial, sans-serif";
          const first = card.teams[0] || { team: "Por definir", score: "-" };
          const second = card.teams[1] || { team: "Por definir", score: "-" };

          ctx.fillStyle = "#f8fafc";
          ctx.fillText(cropText(ctx, first.team, width - 56), x + 16, y + 52);
          ctx.fillText(cropText(ctx, second.team, width - 56), x + 16, y + 82);

          ctx.fillStyle = "#fbbf24";
          ctx.textAlign = "right";
          ctx.fillText(first.score, x + width - 14, y + 52);
          ctx.fillText(second.score, x + width - 14, y + 82);
          ctx.textAlign = "left";
        }

        function drawRound(ctx, round, x, y, width, height, accent) {
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "900 22px Inter, Arial, sans-serif";
          ctx.fillText(round.label, x, y - 16);

          const gap = 9;
          const count = Math.max(1, round.matches.length);
          const cardHeight = Math.min(96, Math.max(64, (height - gap * (count - 1)) / count));
          const totalHeight = cardHeight * count + gap * (count - 1);
          let currentY = y + Math.max(0, (height - totalHeight) / 2);

          round.matches.forEach((card) => {
            drawCard(ctx, card, x, currentY, width, cardHeight, accent);
            currentY += cardHeight + gap;
          });
        }

        function drawShareImage() {
          const data = readBracketData();
          const width = 2000;
          const height = 1125;
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");

          const gradient = ctx.createLinearGradient(0, 0, width, height);
          gradient.addColorStop(0, "#07111f");
          gradient.addColorStop(0.48, "#102033");
          gradient.addColorStop(1, "#050816");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = "rgba(20, 184, 106, 0.18)";
          ctx.beginPath();
          ctx.arc(170, 115, 280, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(239, 51, 64, 0.14)";
          ctx.beginPath();
          ctx.arc(width - 160, 110, 290, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#f8fafc";
          ctx.font = "900 58px Inter, Arial, sans-serif";
          ctx.fillText("Mi predicción del Mundial 2026", 70, 82);

          ctx.fillStyle = "#cbd5e1";
          ctx.font = "700 28px Inter, Arial, sans-serif";
          ctx.fillText(cropText(ctx, data.predictionName, 650), 70, 126);

          const championX = 770;
          const championY = 48;
          const championW = 1160;
          const championH = 108;
          roundRect(ctx, championX, championY, championW, championH, 22);
          ctx.fillStyle = "rgba(251, 191, 36, 0.16)";
          ctx.fill();
          ctx.strokeStyle = "rgba(251, 191, 36, 0.55)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = "#fbbf24";
          ctx.font = "900 26px Inter, Arial, sans-serif";
          ctx.fillText("CAMPEÓN", championX + 28, championY + 38);
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 52px Inter, Arial, sans-serif";
          ctx.fillText(cropText(ctx, data.champion, championW - 70), championX + 28, championY + 88);

          const top = 230;
          const areaHeight = 780;
          const cardWidth = 185;
          const leftXs = [55, 278, 501, 724];
          const rightXs = [1091, 1314, 1537, 1760];
          const accents = ["#38bdf8", "#60a5fa", "#a78bfa", "#fbbf24"];

          data.leftRounds.forEach((round, index) => drawRound(ctx, round, leftXs[index], top, cardWidth, areaHeight, accents[index] || "#38bdf8"));
          data.rightRounds.forEach((round, index) => drawRound(ctx, round, rightXs[index], top, cardWidth, areaHeight, accents[3 - index] || "#38bdf8"));

          const centerX = 925;
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "900 24px Inter, Arial, sans-serif";
          ctx.fillText("Partidos finales", centerX, top - 16);
          data.finalCards.forEach((card, index) => {
            drawCard(ctx, card, centerX, top + 95 + index * 190, 250, 112, index === 0 ? "#94a3b8" : "#fbbf24");
          });

          roundRect(ctx, 775, 780, 450, 130, 22);
          ctx.fillStyle = "rgba(21, 181, 111, 0.14)";
          ctx.fill();
          ctx.strokeStyle = "rgba(21, 181, 111, 0.45)";
          ctx.stroke();
          ctx.fillStyle = "#15b56f";
          ctx.font = "900 24px Inter, Arial, sans-serif";
          ctx.fillText("GANADOR DE LA SIMULACIÓN", 805, 825);
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 44px Inter, Arial, sans-serif";
          ctx.fillText(cropText(ctx, data.champion, 390), 805, 880);

          ctx.fillStyle = "#94a3b8";
          ctx.font = "700 20px Inter, Arial, sans-serif";
          ctx.fillText("Simulado en simulador-mundial-two.vercel.app", 70, 1065);
          ctx.textAlign = "right";
          ctx.fillText("Comparte tu bracket y reta a tus amigos", width - 70, 1065);
          ctx.textAlign = "left";

          return canvas;
        }

        function canvasToBlob(canvas) {
          return new Promise((resolve) => canvas.toBlob(resolve, "image/png", 0.95));
        }

        async function createShareImage() {
          const canvas = drawShareImage();
          if (latestImageUrl) URL.revokeObjectURL(latestImageUrl);
          latestImageBlob = await canvasToBlob(canvas);
          latestImageUrl = URL.createObjectURL(latestImageBlob);
          return latestImageUrl;
        }

        async function openFacebookShare() {
          if (!latestImageBlob) await createShareImage();
          const champion = getChampionName().replace(/[^a-z0-9áéíóúñü -]/gi, "").trim() || "campeon";
          const file = new File([latestImageBlob], `bracket-mundial-2026-${champion}.png`, { type: "image/png" });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: "Mi predicción del Mundial 2026",
              text: `Mi campeón del Mundial 2026 es ${getChampionName()}`,
              files: [file],
            });
            return;
          }

          window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(sharedPredictionUrl())}`, "_blank", "noopener,noreferrer");
        }

        async function showSharePanel() {
          const champion = getChampionName();
          if (!champion || champion.toLowerCase().includes("pendiente") || champion.toLowerCase().includes("por definir")) {
            alert("Completa la final para que la imagen muestre el campeón de tu simulación.");
          }

          const imageUrl = await createShareImage();
          const existing = document.querySelector(".facebook-share-panel");
          if (existing) existing.remove();

          const panel = document.createElement("section");
          panel.className = "facebook-share-panel";
          panel.innerHTML = `
            <div>
              <h3>Imagen lista para compartir</h3>
              <p>Se generó una imagen PNG del bracket con el campeón visible. En celular se intentará compartir la imagen directamente; en escritorio también puedes descargarla y subirla a Facebook.</p>
            </div>
            <img class="facebook-share-preview" alt="Bracket del Mundial 2026 generado por la simulación" src="${imageUrl}" />
            <div class="facebook-share-actions">
              <button type="button" class="facebook-primary" data-share-facebook>Compartir en Facebook</button>
              <a data-download-image download="bracket-mundial-2026.png" href="${imageUrl}">Descargar imagen</a>
              <button type="button" data-copy-link>Copiar enlace de predicción</button>
              <button type="button" data-close-share>Cerrar</button>
            </div>
          `;

          const main = document.querySelector(".page-flow");
          const toolbar = document.querySelector(".toolbar");
          if (main) main.parentElement.insertBefore(panel, main);
          else if (toolbar) toolbar.insertAdjacentElement("afterend", panel);

          panel.querySelector("[data-share-facebook]").addEventListener("click", openFacebookShare);
          panel.querySelector("[data-copy-link]").addEventListener("click", async () => {
            await navigator.clipboard.writeText(sharedPredictionUrl());
            alert("Enlace de predicción copiado.");
          });
          panel.querySelector("[data-close-share]").addEventListener("click", () => panel.remove());
          panel.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function ensureShareButton() {
          const toolbar = document.querySelector(".toolbar");
          if (!toolbar || toolbar.querySelector("[data-bracket-share-button]")) return;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tool-action";
          button.setAttribute("data-bracket-share-button", "true");
          button.innerHTML = "📸 Imagen Facebook";
          button.addEventListener("click", showSharePanel);

          const copyButton = Array.from(toolbar.querySelectorAll("button")).find((item) => item.textContent.includes("Copiar enlace"));
          if (copyButton) copyButton.insertAdjacentElement("afterend", button);
          else toolbar.appendChild(button);
        }

        const observer = new MutationObserver(ensureShareButton);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener("load", ensureShareButton);
        document.addEventListener("DOMContentLoaded", ensureShareButton);
        setTimeout(ensureShareButton, 800);
      })();
    </script>
  </body>
</html>
