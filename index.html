<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador Mundial 2026</title>
    <style>
      @media (max-width: 720px) {
        .bracket-side.left {
          order: 1;
        }

        .final-lane {
          order: 2;
        }

        .bracket-side.right {
          order: 3;
        }

        .bracket-side.left .bracket-round:nth-child(2) h3::after,
        .bracket-side.left .bracket-round:nth-child(3) h3::after,
        .bracket-side.left .bracket-round:nth-child(4) h3::after {
          content: " Lado A";
        }

        .bracket-side.right .bracket-round:nth-child(1) h3::after,
        .bracket-side.right .bracket-round:nth-child(2) h3::after,
        .bracket-side.right .bracket-round:nth-child(3) h3::after {
          content: " Lado B";
        }
      }

      .champion-mark {
        isolation: isolate;
      }

      .champion-mark::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 50% 30%, rgba(251, 191, 36, 0.16), transparent 34%),
          linear-gradient(180deg, rgba(3, 10, 20, 0.12), rgba(3, 10, 20, 0.74));
        pointer-events: none;
      }

      .champion-mark > * {
        position: relative;
        z-index: 1;
      }

      .champion-mark strong {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        padding: 10px 16px;
        border-radius: 999px;
        color: #fff7d6;
        background: rgba(2, 12, 27, 0.66);
        border: 1px solid rgba(251, 191, 36, 0.28);
        box-shadow:
          0 10px 28px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
      }

      .champion-mark strong .team-label {
        justify-content: center;
      }

      .champion-mark strong .team-label > span:last-child {
        white-space: normal;
        overflow: visible;
        text-overflow: initial;
      }

      .champion-mark .confetti {
        opacity: 0.24;
        filter: blur(0.2px);
      }
    </style>
    <script>
      (() => {
        const MOBILE_MAX_WIDTH = 720;
        const SHARE_WIDTH = 1080;
        const SHARE_HEIGHT = 1350;
        const originalToBlob = HTMLCanvasElement.prototype.toBlob;

        function roundedRect(ctx, x, y, width, height, radius) {
          const safeRadius = Math.min(radius, width / 2, height / 2);
          ctx.beginPath();
          ctx.moveTo(x + safeRadius, y);
          ctx.arcTo(x + width, y, x + width, y + height, safeRadius);
          ctx.arcTo(x + width, y + height, x, y + height, safeRadius);
          ctx.arcTo(x, y + height, x, y, safeRadius);
          ctx.arcTo(x, y, x + width, y, safeRadius);
          ctx.closePath();
        }

        function fillRound(ctx, x, y, width, height, radius, fill, stroke) {
          roundedRect(ctx, x, y, width, height, radius);
          ctx.fillStyle = fill;
          ctx.fill();
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.stroke();
          }
        }

        function trimText(ctx, text, maxWidth) {
          if (ctx.measureText(text).width <= maxWidth) return text;
          let output = text;
          while (output.length > 3 && ctx.measureText(`${output}...`).width > maxWidth) {
            output = output.slice(0, -1);
          }
          return `${output}...`;
        }

        function drawText(ctx, text, x, y, font, color, align = "left") {
          ctx.font = font;
          ctx.fillStyle = color;
          ctx.textAlign = align;
          ctx.fillText(text, x, y);
        }

        function getChampionName() {
          const selectors = [
            ".champion-mark strong .team-label span:last-child",
            ".champion-mark strong",
            ".hero-card strong",
          ];
          for (const selector of selectors) {
            const element = document.querySelector(selector);
            const text = element?.textContent?.replace("Campeón:", "").trim();
            if (text && !/por definir/i.test(text)) return text;
          }
          return "Por definir";
        }

        function getChampionFlagSrc() {
          const image = document.querySelector(".champion-mark strong .flag-img, .hero-card .flag-img");
          return image?.getAttribute("src") || "";
        }

        function loadImage(src) {
          return new Promise((resolve) => {
            if (!src) return resolve(null);
            const image = new Image();
            image.crossOrigin = "anonymous";
            image.onload = () => resolve(image);
            image.onerror = () => resolve(null);
            image.src = src;
          });
        }

        function drawPremiumChampion(ctx, championName, championImage) {
          const x = 70;
          const y = 164;
          const width = 940;
          const height = 268;
          const gradient = ctx.createLinearGradient(x, y, x + width, y + height);
          gradient.addColorStop(0, "rgba(25, 55, 83, 0.98)");
          gradient.addColorStop(0.55, "rgba(9, 31, 51, 0.98)");
          gradient.addColorStop(1, "rgba(47, 37, 19, 0.98)");
          fillRound(ctx, x, y, width, height, 34, gradient, "rgba(251, 191, 36, 0.46)");

          ctx.save();
          ctx.globalAlpha = 0.52;
          for (let i = 0; i < 26; i += 1) {
            const dotX = x + 42 + ((i * 139) % (width - 84));
            const dotY = y + 28 + ((i * 67) % (height - 56));
            ctx.fillStyle = i % 3 === 0 ? "#fbbf24" : i % 3 === 1 ? "#38bdf8" : "#22c55e";
            ctx.beginPath();
            ctx.arc(dotX, dotY, i % 2 === 0 ? 7 : 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          const overlay = ctx.createLinearGradient(x, y, x, y + height);
          overlay.addColorStop(0, "rgba(3, 10, 20, 0.12)");
          overlay.addColorStop(1, "rgba(3, 10, 20, 0.72)");
          fillRound(ctx, x, y, width, height, 34, overlay);

          fillRound(ctx, x + 30, y + 28, 170, 46, 23, "rgba(251,191,36,0.16)", "rgba(251,191,36,0.35)");
          drawText(ctx, "CAMPEÓN", x + 115, y + 59, "900 21px Arial", "#fbbf24", "center");

          ctx.save();
          ctx.shadowColor = "rgba(251, 191, 36, 0.42)";
          ctx.shadowBlur = 28;
          drawText(ctx, "🏆", x + width / 2, y + 92, "700 54px Arial", "#fbbf24", "center");
          ctx.restore();

          fillRound(ctx, x + 160, y + 116, width - 320, 94, 47, "rgba(2,12,27,0.72)", "rgba(255,255,255,0.14)");
          if (championImage) {
            ctx.save();
            roundedRect(ctx, x + 194, y + 136, 82, 56, 12);
            ctx.clip();
            ctx.drawImage(championImage, x + 194, y + 136, 82, 56);
            ctx.restore();
          }
          ctx.save();
          ctx.shadowColor = "rgba(251, 191, 36, 0.22)";
          ctx.shadowBlur = 16;
          drawText(ctx, trimText(ctx, championName, 430), x + width / 2 + 52, y + 176, "900 48px Arial", "#fff7d6", "center");
          ctx.restore();

          drawText(ctx, "Mi predicción al campeón del Mundial 2026", x + width / 2, y + 244, "600 22px Arial", "#cbd5e1", "center");
        }

        function drawMobileShare(originalCanvas, callback, type, quality) {
          const canvas = document.createElement("canvas");
          canvas.width = SHARE_WIDTH;
          canvas.height = SHARE_HEIGHT;
          const ctx = canvas.getContext("2d");
          if (!ctx) {
            originalToBlob.call(originalCanvas, callback, type, quality);
            return;
          }

          Promise.resolve(loadImage(getChampionFlagSrc())).then((championImage) => {
            const championName = getChampionName();
            const bg = ctx.createLinearGradient(0, 0, 0, SHARE_HEIGHT);
            bg.addColorStop(0, "#06111e");
            bg.addColorStop(0.55, "#081d31");
            bg.addColorStop(1, "#07111d");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, SHARE_WIDTH, SHARE_HEIGHT);

            ctx.save();
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(88, 82, 190, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(1010, 205, 245, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            drawText(ctx, "Mi bracket del Mundial 2026", 64, 88, "900 48px Arial", "#f8fafc");
            drawText(ctx, "Mi simulación", 64, 124, "700 25px Arial", "#a8bbd2");

            fillRound(ctx, 718, 48, 292, 74, 22, "rgba(251,191,36,0.13)", "rgba(251,191,36,0.34)");
            drawText(ctx, "CAMPEÓN", 746, 80, "900 18px Arial", "#fbbf24");
            drawText(ctx, trimText(ctx, championName, 220), 746, 108, "900 29px Arial", "#ffffff");

            drawPremiumChampion(ctx, championName, championImage);

            drawText(ctx, "Bracket completo", 70, 498, "900 28px Arial", "#f8fafc");
            drawText(ctx, "Rondas finales organizadas para compartir", 70, 530, "600 20px Arial", "#9fb4cc");

            fillRound(ctx, 52, 556, 976, 594, 28, "rgba(7, 18, 31, 0.92)", "rgba(148, 163, 184, 0.20)");
            ctx.save();
            roundedRect(ctx, 70, 574, 940, 558, 20);
            ctx.clip();
            ctx.drawImage(originalCanvas, 0, 116, 1800, 804, 70, 574, 940, 558);
            ctx.restore();

            fillRound(ctx, 70, 1178, 940, 86, 24, "rgba(255,255,255,0.045)", "rgba(255,255,255,0.12)");
            drawText(ctx, "Haz tu predicción en", SHARE_WIDTH / 2, 1212, "700 21px Arial", "#9fb4cc", "center");
            drawText(ctx, window.location.host || "simulador-mundial-26.vercel.app", SHARE_WIDTH / 2, 1244, "900 25px Arial", "#f8fafc", "center");

            originalToBlob.call(canvas, callback, type || "image/png", quality || 0.95);
          });
        }

        HTMLCanvasElement.prototype.toBlob = function patchedToBlob(callback, type, quality) {
          const isShareCanvas = this.width === 1800 && this.height === 1080;
          const isMobile = window.matchMedia(`(max-width: ${MOBILE_MAX_WIDTH}px)`).matches;
          if (isMobile && isShareCanvas) {
            drawMobileShare(this, callback, type, quality);
            return;
          }
          originalToBlob.call(this, callback, type, quality);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
